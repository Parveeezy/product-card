<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <title>Document</title>
</head>

<body style="font-family: Montserrat;">
    <div class="wrapper">
        <div class="title-container">
            <h1 class="title">Выбери свой продукт</h1>
        </div>
        <div class="cards-container">
            <ul class="cards-wrapper" style="list-style-type: none;">
                <li class="card">
                    <img src="./assets/photo 1.png" alt="photo1" class="card-img" />
                    <p class="card-skin-type">для нормальной кожи</p>
                    <h3 class="card-title">Увлажняющий мусс</h3>
                    <p class="card-description">Глубоко увлажняют кожу лица, оставляя её мягкой и гладкой.</p>
                    <ul class="ingredients-wrapper">
                        Состав:
                        <li class="ingredients">
                            <span class="ingredient-dot"></span>
                            <span class="ingredient-text">активные натуральные комплексы</span>
                        </li>
                        <li class="ingredients">
                            <span class="ingredient-dot"></span>
                            <span class="ingredient-text">витамины С, А, РР, В И Е</span>
                        </li>
                        <li class="ingredients">
                            <span class="ingredient-dot"></span>
                            <span class="ingredient-text">солнцезащитные компоненты</span>
                        </li>
                    </ul>
                    <div class="card-price-wrapper">
                        <p class="card-price-text">Цена</p>
                        <p class="card-price">2 750 ₽</p>
                    </div>
                </li>
            </ul>
        </div>
    </div>
</body>

</html>
