<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="style.css" />
        <title>Product Card</title>
    </head>
    <body>
        <div class="register">
            <button id="register">Регистрация</button>
        </div>
        <div class="container">
            <div class="wrapper">
                <div class="title-container">
                    <h1 id="title-text" class="title">Выбери свой продукт</h1>
                </div>
                <template class="cards-template">
                    <div class="product-card">
                        <img src="" alt="" class="card-img" />
                        <p class="card-skin-type"></p>
                        <h3 class="card-title"></h3>
                        <p class="card-description"></p>
                        <span>Состав:</span>
                        <ul class="ingredients-wrapper"></ul>
                        <div class="card-price-wrapper">
                            <p class="card-price-text">Цена</p>
                            <p class="card-price"></p>
                        </div>
                    </div>
                </template>
                <div class="cards-container"></div>
            </div>

            <footer>
                <div class="footer-content-wrapper">
                    <div class="footer-content-info-block">
                        <h2 class="footer-content-info-title">Product Cards</h2>
                        <p class="footer-content-info-description">
                            У нас самые лучшие продукты для кожи!
                        </p>
                        <div class="footer-content-info-social-icons">
                            <img src="./assets/tg-icon.svg" alt="telegram" />
                            <img src="./assets/vk-icon.svg" alt="vk" />
                        </div>
                    </div>
                    <div class="footer-subscribe-block">
                        <p class="footer-subscribe-title">
                            Подпишись на наши акции:
                        </p>
                        <form id="subscribe">
                            <input
                                class="input"
                                type="email"
                                name="email"
                                required
                                placeholder="Введи Email..."
                            />
                            <button type="submit" class="submit">
                                Подписаться
                            </button>
                        </form>
                    </div>
                    <nav class="footer-nav-block">
                        <p class="footer-nav-title">Быстрые ссылки</p>
                        <ul class="footer-nav-links">
                            <li>
                                <a href="#" class="footer-nav-link">Главная</a>
                            </li>
                            <li>
                                <a href="#" class="footer-nav-link">Магазин</a>
                            </li>
                            <li>
                                <a href="#" class="footer-nav-link">Контакты</a>
                            </li>
                        </ul>
                    </nav>
                </div>
                <div class="footer-right-section">
                    <div class="footer-rights">
                        <p class="footer-rights-description">
                            www.product-cards.com © all right reserve
                        </p>
                    </div>
                </div>
            </footer>
        </div>

        <script type="module" src="main.js"></script>

        <div class="overlay" id="registration-modal">
            <div class="modal">
                <div class="close-modal">
                    <button class="close-modal-btn">X</button>
                </div>
                <h2 class="modal-title">Регистрация</h2>
                <form id="modal-form">
                    <div>
                        <label for="name">Имя</label>
                        <input
                            type="text"
                            id="name"
                            required
                            minlength="2"
                            placeholder="Ваше имя"
                        />
                    </div>
                    <div>
                        <label for="surname">Фамилия</label>
                        <input
                            type="text"
                            id="surname"
                            required
                            minlength="2"
                            placeholder="Ваша фамилия"
                        />
                    </div>
                    <div>
                        <label for="birthdate">Дата рождения</label>
                        <input
                            type="date"
                            id="birthdate"
                            required
                            placeholder="Ваша дата рождения"
                        />
                    </div>
                    <div>
                        <label for="login">Логин</label>
                        <input
                            type="text"
                            id="login"
                            required
                            minlength="2"
                            placeholder="Ваш логин"
                        />
                    </div>
                    <div>
                        <label for="password" minlength="6">Пароль</label>
                        <input
                            type="password"
                            id="password"
                            required
                            minlength="6"
                            placeholder="Введите пароль"
                        />
                    </div>
                    <div>
                        <label for="return-password" minlength="6"
                            >Повторить пароль</label
                        >
                        <input
                            type="password"
                            id="return-password"
                            required
                            minlength="6"
                            placeholder="Повторите пароль"
                        />
                    </div>
                    <button class="submit" type="submit">Отправить</button>
                </form>
            </div>
        </div>
    </body>
</html>
