<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <title>Product Card</title>
  </head>
  <body>
    <div class="wrapper">
      <div class="title-container">
        <h1 id="title-text" class="title">Выбери свой продукт</h1>
      </div>
      <template class="cards-template">
        <div class="product-card">
          <img src="" alt="" class="card-img" />
          <p class="card-skin-type"></p>
          <h3 class="card-title"></h3>
          <p class="card-description"></p>
          <span>Состав:</span>
          <ul class="ingredients-wrapper"></ul>
          <div class="card-price-wrapper">
            <p class="card-price-text">Цена </p>
            <p class="card-price"></p>
          </div>
        </div>
      </template>
      <div class="cards-container"></div>
    </div>
    <script type="module" src="homework-8.js"></script>
  </body>
</html>
